services:
  - type: web
    name: ocr-backend
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENVIRONMENT
        value: "production"
      - key: LOG_LEVEL
        value: "INFO"
      - key: JWT_SECRET
        generateValue: true
      # SECURITY: Set these in the Render dashboard, not here
      - key: GOOGLE_SHEETS_API_KEY
        sync: false
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: MESA_PARTES_SHEET_ID
        sync: false
      - key: MESA_PARTES_APPS_SCRIPT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://rolesdeservicio.web.app"
    healthCheckPath: /health
