services:
  - type: web
    name: ocr-backend
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENVIRONMENT
        value: "production"
      - key: LOG_LEVEL
        value: "INFO"
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_SHEETS_API_KEY
        value: "AIzaSyCrdStW9-jK7vz76EuB8KA7Ea_m9aVOoeI"
      - key: GOOGLE_SHEETS_ID
        value: "1elNfbmPM5KxW0jnttJc8kGGokPT8XUoda3iZ6qdZvZA"
      - key: GOOGLE_APPS_SCRIPT_URL
        value: "https://script.google.com/macros/s/AKfycbydeAColIxKHhX-lm5LMw5bd3ebYZ-YrRRZn-xnbQTRtYecG0hujpEqNfZ5107wedP9vA/exec"
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173"
    healthCheckPath: /health
